name: Monthly Schema Refresh
on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh all timestamps
        run: |
          TIMESTAMP=\$(date -u +%Y-%m-%dT%H:%M:%SZ)
          TODAY=\$(date -u +%Y-%m-%d)
          for dir in faqs help services webpages personnel; do
            if [ -d "\$dir" ]; then
              for file in \$dir/*.json; do
                [ -f "\$file" ] && sed -i "s/\\"dateModified\\":.*./\\"dateModified\\": \\"\$TIMESTAMP\\",/" "\$file" 2>/dev/null || true
              done
            fi
          done
          [ -f "sitemap.xml" ] && sed -i "s|<lastmod>[0-9]\\{4\\}-[0-9]\\{2\\}-[0-9]\\{2\\}</lastmod>|<lastmod>\$TODAY</lastmod>|g" sitemap.xml
          find . -name '*.html' -exec sed -i "s|Last updated: [0-9]\\{4\\}-[0-9]\\{2\\}-[0-9]\\{2\\}|Last updated: \$TODAY|g" {} \\;
          git config user.name 'Schema Monster'
          git config user.email 'noreply@schema.monster'
          git add -A
          git diff --staged --quiet || (git commit -m '📅 Monthly refresh - FICA Tip Calculator' && git push)
      - name: Ping Google & Bing
        run: |
          curl -s "https://www.google.com/ping?sitemap=https://AIOVisibilityHub.github.io/fica-tip-calculator-ai-schemas-7srq/sitemap.xml" || true
          curl -s "https://www.bing.com/ping?sitemap=https://AIOVisibilityHub.github.io/fica-tip-calculator-ai-schemas-7srq/sitemap.xml" || true
